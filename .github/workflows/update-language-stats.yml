name: Update language stats

on:
  workflow_dispatch:

  # Automatic updates are paused. To restore them, uncomment:
  # schedule:
  #   # GitHub Actions cron uses UTC. 09:00 UTC = 12:00 Moscow time.
  #   - cron: "0 9 * * *"

permissions:
  contents: write

concurrency:
  group: update-language-stats-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Generate language chart
        shell: bash
        env:
          LANG_STATS_TOKEN: ${{ secrets.LANG_STATS_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${LANG_STATS_TOKEN:-}" ]]; then
            echo "::error::Repository secret LANG_STATS_TOKEN is missing"
            exit 1
          fi

          go run ./cmd/language-stats
          test -s assets/languages.svg

      - name: Commit changes
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- assets/languages.svg

          if git diff --cached --quiet; then
            echo "Language stats did not change"
            exit 0
          fi

          git commit -m "chore: update language stats"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
